<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Cairo', sans-serif;
            background-image: 
                linear-gradient(rgba(0, 255, 100, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 100, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        h2 {
            color: #00ff64;
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid #00ff64;
            text-shadow: 0 0 10px #00ff64;
            margin-bottom: 10px;
        }

        .video-list {
            list-style: none;
            background: rgba(0, 20, 10, 0.8);
            border: 1px solid #00ff64;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.2);
            overflow-y: auto;
        }

        .video-list li {
            margin-bottom: 10px;
        }

        .video-list a {
            display: block;
            padding: 15px;
            background: #001a0a;
            color: #00ff64;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #003300;
            transition: all 0.3s ease;
            font-weight: 700;
        }

        .video-list a:hover {
            background: #00ff64;
            color: #000;
            transform: translateX(-5px);
            box-shadow: 0 0 15px #00ff64;
        }

        .video-list a:active {
            transform: scale(0.98);
        }

        .main-content {
            background: rgba(0, 20, 10, 0.8);
            border: 1px solid #00ff64;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            background: #000;
        }

        /* Scrollbar ستايل هكر */
        .video-list::-webkit-scrollbar {
            width: 8px;
        }

        .video-list::-webkit-scrollbar-track {
            background: #001a0a;
        }

        .video-list::-webkit-scrollbar-thumb {
            background: #00ff64;
            border-radius: 4px;
        }

        /* للموبايل */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .video-list {
                height: 250px;
            }
            .main-content {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <h2>VIDEO LIST</h2>
            <ul class="video-list">
                <li><a href="https://youtube.com/shorts/4jXzwKogm98?si=dRb0qjs6xl1dNleb" target="videoFrame">Video 1: Intro</a></li>
                <li><a href="https://youtube.com/shorts/fY20cBqt764?si=Qf0w6HFs-pEUkDyj" target="videoFrame">Video 2: Tutorial</a></li>
                <li><a href="https://youtube.com/shorts/ywYFf4c203Q?si=DtwksaC6ANV_Gbs6" target="videoFrame">Video 3: lock</a></li>
                <li><a href="https://youtu.be/a6zymvLOByI?si=jJjx2otZYmysdP5Y" target="videoFrame">Video 4: full</a></li>
            </ul>
        </div>
        
        <div class="main-content">
            <iframe name="videoFrame" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
